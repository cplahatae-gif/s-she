<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근접 장면 비교</title><link rel="stylesheet" href="./src/actions.css"><script type="module" src="./src/compare.js"></script><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#111315;color:#eceef0;font:16px/1.5 system-ui,sans-serif}main{max-width:1800px;margin:auto}h1{font-size:24px;font-weight:600}a{color:#a6caff}nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:20px 0}button,select{font:inherit;color:inherit;background:#25292d;border:1px solid #586068;padding:10px 14px;border-radius:6px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #a6caff;outline-offset:3px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}h2{font-size:16px;font-weight:500}.frame{position:relative;aspect-ratio:16/9;background:#090a0b;display:flex;align-items:center;justify-content:center;overflow:hidden}.frame>img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.comparison .action-scene{position:absolute;padding:8px;gap:6px}.comparison .action-narration{font-size:13px;padding:6px 10px}.note{color:#b2bac3;font-size:14px}#status{min-height:24px}@media(max-width:850px){body{padding:12px}.comparison{grid-template-columns:1fr}}
</style></head><body><main><h1>근접 장면 비교</h1><p class="note">왼쪽은 수정 전 플레이 캡처, 오른쪽은 새 사진과 실제 게임의 재생 방식입니다.</p><nav><label>장면 <select id="scene"><option value="lock-correct">본인 자물쇠 체결</option><option value="cleanup-correct">이물질 제거</option><option value="lock-other-person">타인 잠금 오답</option></select></label><button id="play" type="button">수정 장면 재생</button><label><input id="reduced" type="checkbox"> 움직임 줄이기</label><a href="./index.html">게임으로 돌아가기</a></nav><div class="comparison"><section><h2>수정 전</h2><div class="frame"><img id="before" alt="수정 전 플레이 캡처"></div></section><section><h2>수정 후</h2><div class="frame" id="after"><img id="result" alt="수정 후 근접 장면"></div></section></div><p id="status" role="status" aria-live="polite"></p><p class="note">사진 비율을 유지하고 과도한 확대와 잘림을 줄였습니다. 동작은 같은 구도의 사진을 순서대로 보여줍니다.</p></main></body></html>
